<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 240px;
      background: #111;
      color: #ccc;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 14px;
      margin: 0;
    }
    h2 { color: #ff4444; margin: 0 0 12px; font-size: 15px; }

    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .site-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .site-name { font-size: 13px; color: #ddd; font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Toggle switch */
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #333; border-radius: 20px; cursor: pointer;
      transition: background .2s;
    }
    .slider:before {
      content: ""; position: absolute;
      width: 14px; height: 14px; left: 3px; top: 3px;
      background: #888; border-radius: 50%;
      transition: transform .2s, background .2s;
    }
    input:checked + .slider { background: #ff4444; }
    input:checked + .slider:before { transform: translateX(16px); background: #fff; }

    .status { font-size: 11px; margin-top: 2px; }
    .status.on  { color: #ff4444; }
    .status.off { color: #555; }

    .tip { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 6px; padding: 8px 10px; font-size: 11px; color: #666; line-height: 1.6; }
    .tip b { color: #ccc; }
    #server-status { font-size: 11px; margin-top: 10px; }
    a { color: #4caf50; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>✂️ ClipGrab</h2>

  <div class="site-row">
    <div>
      <div class="site-label">Clip button on</div>
      <div class="site-name" id="hostname">—</div>
      <div class="status off" id="status-text">Disabled</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="site-toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="tip">
    <b>How to clip:</b><br>
    1. Enable on a site above<br>
    2. Play the video or live stream<br>
    3. Click <b>✂️ Clip</b> on the video<br>
    4. ClipMemeEditor opens — trim, caption &amp; export
  </div>

  <div id="server-status"></div>
  <p><a href="welcome.html" target="_blank" rel="noopener">Account &amp; welcome</a></p>

  <script src="popup.js"></script>
</body>
</html>
